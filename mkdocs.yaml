# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Modelblocks documentation
site_url: https://modelblocks.readthedocs.io/
repo_name: docs
repo_url: https://github.com/modelblocks-org/docs/
edit_uri: edit/main/docs/
extra_css:
  - css/extra.css
theme:
  font:
    text: Lato
    code: Fira Code
  name: material
  features:
  - navigation.indexes
  - navigation.top
  - navigation.tabs
  - navigation.tabs.sticky
  - content.code.copy
  - content.code.annotate
  - search.suggest
  - search.highlight
  - search.share
  - toc.follow
  # palette:
  #   # Palette toggle for automatic mode
  #   - media: "(prefers-color-scheme)"
  #     toggle:
  #       icon: material/brightness-auto
  #       name: Switch to light mode
  #     primary: teal
  #     accent: blue grey
  #   # Palette toggle for light mode
  #   - media: "(prefers-color-scheme: light)"
  #     scheme: default
  #     toggle:
  #       icon: material/weather-sunny
  #       name: Switch to dark mode
  #     primary: teal
  #     accent: blue grey
  #   # Palette toggle for dark mode
  #   - media: "(prefers-color-scheme: dark)"
  #     scheme: slate
  #     toggle:
  #       icon: material/weather-night
  #       name: Switch to system preference
  #     primary: teal
  #     accent: blue grey
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # - mkdocs-click
  - def_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      dedent_subsections: true
  - pymdownx.superfences:
      preserve_tabs: true
      # FIXME: remove mermaid?
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      clickable_checkbox: true
  - toc:
      anchorlink: true
      permalink: "¶"
      toc_depth: 3
plugins:
  - autorefs
  - git-committers:
      enabled: true
      repository: modelblocks-org/docs
      branch: main
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_bases: true
            filters:
              - "!^_"
            heading_level: 1
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
            signature_crossrefs: true
            show_root_toc_entry: false
            show_signature_annotations: true
            inherited_members: false
            show_labels: false
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
  - search
nav:
  - Home: index.md
  - Background:
    - Background/motivation.md
    - Background/our_framework.md
  - Modules: Modules/modules.md
  - Developer guidelines:
    - Developer_guidelines/getting_started.md
    - Developer_guidelines/requirements.md
    - Developer_guidelines/templates.md

